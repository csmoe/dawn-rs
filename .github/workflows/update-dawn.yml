name: Update Dawn Generated Code

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dawn:
    name: Regenerate and Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Regenerate all supported targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ./scripts/update_dawn_release.py --force

      - name: Test code generator
        run: cargo test -p dawn-codegen

      - name: Check generated bindings
        run: cargo check -p dawn-rs --no-default-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "dawn-bot"
            git config user.email "dawn-bot@users.noreply.github.com"
            version="$(cat DAWN_VERSION)"
            git add -A
            git commit -m "chore: update Dawn to ${version}"
            git push
          else
            echo "No changes to commit"
          fi
